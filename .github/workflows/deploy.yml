name: Deploy seedhodler.io

# main is the release branch. Whatever lands here is what users get.
# Development happens on dev; main is updated deliberately, not continuously.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and publish to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # npm ci installs exactly what package-lock.json pins. npm install may
      # resolve newer versions, which would make the published bundle depend on
      # the day it was built. For a tool that handles seeds, that is not
      # acceptable in the branch that ships.
      - name: Install pinned dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
