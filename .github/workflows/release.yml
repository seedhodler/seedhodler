name: Release

# Publishes the single-file, self-contained build as a GitHub Release asset when
# a version tag (vX.Y.Z) is pushed. The whole point of Seedhodler is one file you
# can verify once and run offline, so a release must be: validated by the same
# checks as CI, reproducible (the build is byte-identical for a given commit, so
# the published SHA-256 can be re-derived from source), checksummed, and backed
# by build provenance that binds the file to this commit and workflow.
#
# workflow_dispatch runs everything and uploads the file as a workflow artifact
# for inspection, but only a tag push creates a Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets
  id-token: write # provenance attestation signing
  attestations: write # write the provenance attestation

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    # Job-level so the sign step's `if` can read MINISIGN_KEY. Empty (no secret)
    # until the key is configured, which cleanly disables signing.
    env:
      MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install pinned dependencies
        run: npm ci

      # The same gates as CI, so a released artifact is never less checked than
      # a normal build.
      - name: Typecheck
        run: npm run typecheck

      - name: Conformance tests
        run: npm test

      - name: Entropy input tests
        run: npm run test:entropy

      # The commit is taken from the GitHub context rather than the working tree,
      # so the footer stamp can never pick up a "-dirty" suffix. The commit date
      # is still derived from git (deterministic per commit).
      # Two variants from one commit: the online build (keeps printing, also what
      # seedhodler.io ships) and the offline build (every print option hidden,
      # embedded in Seedhodler OS where offline printing is unreliable). Both are
      # self-contained; both are checksummed, attested and signed below.
      - name: Build single-file HTML (online + offline)
        env:
          SEEDHODLER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run build
          npm run check:selfcontained
          cp build/index.html "seedhodler-${GITHUB_REF_NAME}.html"
          VITE_NOPRINT=1 npm run build
          npm run check:selfcontained
          cp build/index.html "seedhodler-${GITHUB_REF_NAME}-offline.html"

      - name: Name the assets and write checksums
        id: asset
        run: |
          set -euo pipefail
          online="seedhodler-${GITHUB_REF_NAME}.html"
          offline="seedhodler-${GITHUB_REF_NAME}-offline.html"
          sha256sum "$online" "$offline" > SHA256SUMS.txt
          echo "online=$online" >> "$GITHUB_OUTPUT"
          echo "offline=$offline" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt

      # First-party GitHub action. Binds the file to this repo, commit and
      # workflow run; verifiable later with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.asset.outputs.online }}
            ${{ steps.asset.outputs.offline }}

      # Independent signature with the project's own minisign key, so trust does
      # not rest solely on GitHub. Runs only once MINISIGN_KEY is configured
      # (below), so the workflow keeps working until the key is set up. The
      # public key lives in the repo as minisign.pub for verification.
      - name: Sign with minisign
        id: minisign
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          ONLINE: ${{ steps.asset.outputs.online }}
          OFFLINE: ${{ steps.asset.outputs.offline }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          for f in "$ONLINE" "$OFFLINE" SHA256SUMS.txt; do
            printf '%s' "${MINISIGN_PASSWORD:-}" | minisign -S -s minisign.key -m "$f" -t "seedhodler ${GITHUB_REF_NAME}"
          done
          rm -f minisign.key
          echo "signed=true" >> "$GITHUB_OUTPUT"
          ls -la ./*.minisig

      # Always available for inspection, including on workflow_dispatch runs.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seedhodler-html
          path: |
            ${{ steps.asset.outputs.online }}
            ${{ steps.asset.outputs.offline }}
            SHA256SUMS.txt
            *.minisig
          if-no-files-found: error

      - name: Create or update the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          online="${{ steps.asset.outputs.online }}"
          offline="${{ steps.asset.outputs.offline }}"

          # Assets: both builds, their checksums, and any minisign signatures.
          files=( "$online" "$offline" SHA256SUMS.txt )
          for s in "$online.minisig" "$offline.minisig" SHA256SUMS.txt.minisig; do
            [ -f "$s" ] && files+=( "$s" )
          done

          notes="Single-file, self-contained Seedhodler build. One file, no network at runtime."
          notes+=$'\n\n'"\`$online\` is the normal build. \`$offline\` hides every print option and is what Seedhodler OS embeds (print the blank forms on a normal printer instead)."
          notes+=$'\n\n'"**Verify before you trust it with a seed:**"
          notes+=$'\n\n'"- Checksum: \`sha256sum -c SHA256SUMS.txt\`"
          notes+=$'\n'"- Provenance: \`gh attestation verify $online --repo ${{ github.repository }}\`"
          notes+=$'\n'"- Reproduce from source: check out this tag and run \`npm ci && npm run build\`; \`build/index.html\` has the same SHA-256 as \`$online\` (add \`VITE_NOPRINT=1\` for \`$offline\`)."
          if [ "${{ steps.minisign.outputs.signed }}" = "true" ]; then
            notes+=$'\n'"- Signature: \`minisign -Vm $online -p minisign.pub\` (public key in the repo)"
          fi
          notes+=$'\n\n'"**Run it offline.** Ideally boot a live USB OS with no network and open the file there. Do not use it on a machine that has been online with your seed."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" --title "$tag" --notes "$notes" "${files[@]}"
          fi
