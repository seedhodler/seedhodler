name: CI

# Runs on dev and on every pull request. Builds, but deploys nothing:
# a publicly reachable build of a seed splitting tool that nobody has
# reviewed is a liability, not a preview.

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"

      - name: Install pinned dependencies
        run: npm ci

      # tsc was silently broken for the whole life of the Vite migration, so
      # this gate is the point of the cleanup that added it. vite build does
      # not typecheck; without this step nothing does.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
