name: Container

# Builds the self-contained image and proves it serves the app.
#
# Pushes to GHCR only from dev, and the package stays private: an unreviewed
# build of a seed splitting tool should not be something a stranger can pull
# and mistake for a release.

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: seedhodler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Serve it
        run: |
          docker run --detach --name seedhodler-ci --publish 8080:80 seedhodler:ci
          for _ in $(seq 30); do
            curl --silent --fail http://localhost:8080/ > /dev/null && break
            sleep 1
          done

      # The healthcheck is part of the image, so it has to be checked too.
      # Reaching the app through the published port does not prove that the
      # container can reach itself.
      - name: The container reports itself healthy
        run: |
          for _ in $(seq 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' seedhodler-ci)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          docker inspect --format '{{json .State.Health}}' seedhodler-ci
          [ "$(docker inspect --format '{{.State.Health.Status}}' seedhodler-ci)" = "healthy" ]

      - name: The page is served
        run: |
          curl --silent --fail http://localhost:8080/ -o page.html
          grep -q "<title>Seedhodler</title>" page.html

      # Routing laeuft seit dem Single-File-Build ueber den Hash (#/print), damit
      # die App auch aus einer Datei heraus funktioniert. Ein Pfad wie /print
      # sagt darueber nichts mehr aus; geprueft wird stattdessen, dass nginx
      # jeden Pfad auf das eine Dokument zurueckfallen laesst.
      - name: Any path falls back to the one document
        run: |
          curl --silent --fail http://localhost:8080/print -o fallback.html
          grep -q "<title>Seedhodler</title>" fallback.html

      - name: Security headers are present
        run: |
          headers=$(curl --silent --head http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi "content-security-policy"
          echo "$headers" | grep -qi "x-frame-options: DENY"
          echo "$headers" | grep -qi "referrer-policy: no-referrer"
          echo "$headers" | grep -qi "cache-control: no-store"

      # The app is meant to run with no network. This used to grep the document
      # for "https://", which stops meaning anything once the whole bundle is
      # inlined into it: React names reactjs.org in its error messages, a
      # library names its licence page, the help text links to Wikipedia. None
      # of those are fetched. The check now reads the attributes a browser
      # actually loads from, and it also fails on a second file, which is what
      # broke the offline promise in the first place.
      - name: The document loads nothing, from anywhere
        run: node tools/check-no-external-refs.mjs page.html

      - name: The image really is one file
        run: |
          count=$(docker exec seedhodler-ci sh -c 'ls /usr/share/nginx/html/*.js /usr/share/nginx/html/assets 2>/dev/null | wc -l')
          echo "zusaetzliche JS-Dateien oder assets/: $count"
          [ "$count" = "0" ]

      - name: Stop
        if: always()
        run: docker rm --force seedhodler-ci || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dev image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}
          cache-from: type=gha
