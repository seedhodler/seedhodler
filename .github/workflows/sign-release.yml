name: Sign a release

# Signs an existing release's assets with the project's minisign key and attaches
# the .minisig files. Use it to backfill a signature on a release published
# before signing was set up, or to re-sign after a key rotation. Manual only;
# needs the MINISIGN_KEY secret. Each signature is verified against the committed
# minisign.pub before it is uploaded, so a mismatched key fails the run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # upload the .minisig assets to the release

jobs:
  sign:
    name: Sign release assets
    runs-on: ubuntu-latest
    env:
      MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check that a signing key is configured
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "MINISIGN_KEY secret is not set; nothing to sign with." >&2
            exit 1
          fi

      # For minisign.pub, so each signature is verified before upload.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Download, sign, verify and upload
        run: |
          set -euo pipefail
          pub="$PWD/minisign.pub"

          mkdir assets && cd assets
          # Only the HTML and the checksums are signed; any existing .minisig is
          # left alone (and re-signing clobbers it below).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'seedhodler-*.html' --pattern 'SHA256SUMS.txt'
          ls -la

          umask 077
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          shopt -s nullglob
          signed=()
          for f in seedhodler-*.html SHA256SUMS.txt; do
            [ -f "$f" ] || continue
            printf '%s' "${MINISIGN_PASSWORD:-}" | minisign -S -s minisign.key -m "$f" -t "seedhodler ${TAG}"
            minisign -Vm "$f" -p "$pub"
            signed+=( "$f.minisig" )
          done
          rm -f minisign.key

          if [ ${#signed[@]} -eq 0 ]; then
            echo "No signable assets found on $TAG." >&2
            exit 1
          fi
          echo "Signed and verified: ${signed[*]}"
          gh release upload "$TAG" "${signed[@]}" --clobber
