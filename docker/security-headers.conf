# Included in the server block and repeated in the locations that set their own
# headers: nginx drops inherited add_header directives as soon as a location
# adds one of its own.
#
# The content security policy describes the app's real network surface, so that
# any new outbound request breaks visibly instead of quietly. That surface is
# not empty today:
#
#   fonts.googleapis.com / fonts.gstatic.com   index.html loads Inter from
#                                              Google on every page load
#
# Those two exceptions should disappear once the font ships inside this image.
# style-src and font-src then become 'self', and a tool that tells people to go
# offline stops talking to anyone.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=()" always;
