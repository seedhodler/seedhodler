# Included in the server block and repeated in the locations that set their own
# headers: nginx drops inherited add_header directives as soon as a location
# adds one of its own.
#
# The content security policy describes the app's real network surface, so that
# any new outbound request breaks visibly instead of quietly.
#
# That surface is now empty. Every origin here is 'self', so the page cannot
# reach a third party even if a dependency starts trying to. A tool that tells
# people to go offline no longer talks to anyone.
#
# data: and blob: appear where the app builds its own resources in the browser,
# for the printable PDF among other things. Neither leaves the machine.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=()" always;
