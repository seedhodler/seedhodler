server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Client side routing: /print must not 404 on a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A seed must not survive in a cache, and since the single-file build there
    # is nothing else to cache: the whole app is this one document.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
}
