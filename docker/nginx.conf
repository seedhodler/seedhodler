server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Client side routing: /print must not 404 on a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A seed must not survive in a cache. The bundle is fingerprinted and may be
    # cached forever; the document that starts it must not be cached at all.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
}
